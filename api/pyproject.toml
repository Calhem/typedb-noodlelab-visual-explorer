[project]
name = "typedb-noodlelab-visual-explorer-api"
version = "0.1.0"
description = "Read-only semantic API for the TypeDB Noodlelab Visual Explorer: named TypeQL queries over TypeDB 3"
requires-python = ">=3.13"
dependencies = [
    "typedb-driver==3.14.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
