# Docker Compose file for the TypeDB Noodlelab Visual Explorer.
# Phase 2 (visual prototype) only needs the web dev server:
#   docker compose up web-dev        then open http://127.0.0.1:5180
# Node.js runs inside the container, so nothing needs installing on this computer.
# Published ports are bound to 127.0.0.1, so only this computer can connect.

name: typedb-noodlelab-visual-explorer

services:
  web-dev:
    image: node:24.22.1-alpine
    container_name: noodlelab-web-dev
    working_dir: /web
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5180"]
    ports:
      - "127.0.0.1:5180:5180"
    environment:
      PROJECT_ROOT: /project
    volumes:
      - ./web:/web
      - noodlelab-node-modules:/web/node_modules   # dependencies live in the container, not in the project folder
      - .:/project:ro                       # read-only view of the whole project, for the architecture tests

volumes:
  noodlelab-node-modules:
