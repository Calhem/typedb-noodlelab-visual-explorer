  - {kind: mechanical, joint: bolted, ends: [front-subframe-mount-2, front-rail-r], description: "To the front rail"}
  - {kind: mechanical, joint: bolted, ends: [front-subframe-mount-3, front-floor-rail-l], description: "To the floor rail's bracket"}
  - {kind: mechanical, joint: bolted, ends: [front-subframe-mount-4, front-floor-rail-r], description: "To the floor rail's bracket"}
  - {kind: mechanical, joint: bolted, ends: [rear-subframe-mount-<n>, floor-crossmember-3], each: {n: [1, 2]}, description: "To the rear seat crossmember's brackets"}
