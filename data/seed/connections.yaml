# Physical connections between components: joints, cables, pipes and network links.
#
# kind: mechanical (joint), power (voltage), data (network) or fluid (fluid).
# Placeholders repeat an entry:
#   <c>  each wheel corner: fl, fr, rl, rr; it also sets <a> (front/rear axle) and <s> (left/right side)
#   <a>  each axle: front, rear (when there is no <c>)
#   <s>  each side: l, r (when there is no <c>)
#   anything else comes from the entry's "each" list.

connections:
  # ---- Wheel ends (every corner) ----------------------------------------------------------------------------
  - {kind: mechanical, joint: seated, ends: [tyre-<c>, wheel-<c>], description: "Tyre beads seated on the rim"}
  - {kind: mechanical, joint: bolted, ends: [wheel-<c>, hub-<c>], description: "Wheel clamped to the hub flange by five nuts"}
  - {kind: mechanical, joint: threaded, ends: [wheel-nut-<c>-<n>, hub-<c>], each: {n: [1, 2, 3, 4, 5]}, description: "Nut on a wheel stud"}
  - {kind: mechanical, joint: seated, ends: [wheel-nut-<c>-<n>, wheel-<c>], each: {n: [1, 2, 3, 4, 5]}, description: "Conical seat in the wheel"}
  - {kind: mechanical, joint: bolted, ends: [brake-disc-<c>, hub-<c>], description: "Disc hat clamped between hub and wheel"}
  - {kind: mechanical, joint: press-fit, ends: [hub-<c>, wheel-bearing-<c>]}
  - {kind: mechanical, joint: bolted, ends: [wheel-bearing-<c>, knuckle-<c>], description: "Flanged bearing bolted to the knuckle"}
  - {kind: mechanical, joint: threaded, ends: [hub-nut-<c>, hub-<c>]}
  - {kind: mechanical, joint: splined, ends: ["<a>-halfshaft-<s>", hub-<c>], description: "Drive shaft splined into the hub"}
  - {kind: mechanical, joint: threaded, ends: [hub-nut-<c>, "<a>-halfshaft-<s>"], description: "Axle nut on the drive shaft"}
  - {kind: mechanical, joint: bolted, ends: [caliper-<c>, knuckle-<c>], description: "Calliper mounting lugs"}
  - {kind: mechanical, joint: seated, ends: [brake-pad-inner-<c>, caliper-<c>], description: "Pad held by the pad pin"}
  - {kind: mechanical, joint: seated, ends: [brake-pad-outer-<c>, caliper-<c>], description: "Pad held by the pad pin"}
  - {kind: mechanical, joint: bolted, ends: [brake-shield-<c>, knuckle-<c>]}
  - {kind: mechanical, joint: bolted, ends: [wheel-speed-sensor-<c>, knuckle-<c>]}
  - {kind: fluid, fluid: brake fluid, ends: [brake-hose-<c>, caliper-<c>], description: "Banjo fitting"}
  - {kind: fluid, fluid: brake fluid, ends: [brake-hose-<c>, brake-line-<c>], description: "Hose fitting at the body bracket"}
  - {kind: fluid, fluid: brake fluid, ends: [brake-line-<c>, esc-module], description: "Rigid steel line from the hydraulic unit"}
  - {kind: data, network: hard-wired signal, ends: [epb-actuator-r<s>, esc-module], description: "Motor drive from the module's parking-brake stage"}
  - {kind: data, network: hard-wired signal, ends: [wheel-speed-sensor-<c>, esc-module]}

  # ---- Suspension -----------------------------------------------------------------------------------------
