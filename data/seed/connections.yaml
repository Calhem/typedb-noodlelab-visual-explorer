  - {kind: mechanical, joint: bushed, ends: [toe-link-r<s>, rear-subframe]}
  - {kind: mechanical, joint: bolted, ends: [epb-actuator-r<s>, caliper-r<s>], description: "Motor-on-calliper parking brake"}

  # ---- Steering -------------------------------------------------------------------------------------------
  - {kind: mechanical, joint: bushed, ends: [steering-rack, steering-rack-mount-l], description: "Rubber bush round the rack housing"}
  - {kind: mechanical, joint: bushed, ends: [steering-rack, steering-rack-mount-r], description: "Rubber bush round the rack housing"}
